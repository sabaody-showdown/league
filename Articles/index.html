<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Strategy articles from Sabaody Showdown">
  <title>Articles - Sabaody Showdown</title>
  <style>
    :root {
      --bg-light: #eef3f7;
      --text-dark: #0f1a2b;
      --accent-blue: #2a4d69;
      --accent-light-blue: #4f81a8;
      --card-bg: #ffffff;
    }

    body {
      margin: 0;
      background: var(--bg-light);
      color: var(--text-dark);
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }

    header {
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    nav a {
      margin: 0 12px;
      color: var(--accent-blue);
      font-weight: bold;
      text-decoration: none;
    }

    nav a:hover,
    a:hover {
      color: var(--accent-light-blue);
    }

    .banner {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: cover;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      display: inline-block;
      margin: 0 0 20px;
      border-bottom: 2px solid var(--accent-light-blue);
      color: var(--accent-blue);
    }

    .article-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 20px;
    }

    .article-preview {
      padding: 20px;
      border: 1px solid var(--accent-light-blue);
      border-radius: 8px;
      background: var(--card-bg);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .article-preview h3 {
      margin: 0 0 8px;
      color: var(--accent-blue);
    }

    .article-preview p {
      margin: 8px 0 16px;
    }

    .article-preview a {
      color: var(--accent-blue);
      font-weight: bold;
    }

    .article-author {
      color: #43566a;
      font-size: 0.95rem;
    }

    .message.error {
      color: #9b1c1c;
    }

    footer {
      margin-top: 40px;
      border-top: 1px solid var(--accent-light-blue);
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <img class="banner" src="../Graphics/Banner.jpg" alt="Sabaody Showdown Banner">
    <h1>Articles</h1>
    <nav>
      <a href="../">Homepage</a>
      <a href="./">Articles</a>
      <a href="https://www.twitch.tv/sabaodyshowdown" target="_blank" rel="noopener noreferrer">Twitch</a>
      <a href="https://www.youtube.com/@sabaodyshowdown?sub_confirmation=1" target="_blank" rel="noopener noreferrer">YouTube</a>
      <a href="https://x.com/sabaodyshowdown" target="_blank" rel="noopener noreferrer">Twitter</a>
    </nav>
  </header>

  <main>
    <h2>Latest articles</h2>
    <div id="article-list" class="article-list" aria-live="polite"></div>
  </main>

  <footer>© 2025 Sabaody Showdown — One Piece TCG League</footer>

  <script>
    async function loadArticles() {
      const list = document.getElementById("article-list");
      try {
        const response = await fetch("./articles.json");
        if (!response.ok) {
          throw new Error(`Unable to load the article list (${response.status}).`);
        }

        const data = await response.json();
        if (!Array.isArray(data.articles)) {
          throw new Error("Article data must contain an articles array.");
        }

        if (!data.articles.length) {
          list.textContent = "No articles have been published yet.";
          return;
        }

        data.articles.forEach(article => {
          const card = document.createElement("article");
          card.className = "article-preview";

          const title = document.createElement("h3");
          title.textContent = article.title;

          const author = document.createElement("div");
          author.className = "article-author";
          author.textContent = `By ${article.author}`;

          const excerpt = document.createElement("p");
          excerpt.textContent = article.excerpt;

          const link = document.createElement("a");
          link.href = `article.html?slug=${encodeURIComponent(article.slug)}`;
          link.textContent = "Read article";

          card.append(title, author, excerpt, link);
          list.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        const message = document.createElement("p");
        message.className = "message error";
        message.textContent = "Articles could not be loaded. Please try again later.";
        list.replaceChildren(message);
      }
    }

    loadArticles();
  </script>
</body>
</html>
