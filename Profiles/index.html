<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabaody Showdown – Player Profiles</title>
  <style>
    :root {
      --bg-light: #eef3f7;
      --text-dark: #0f1a2b;
      --accent-blue: #2a4d69;
      --accent-light-blue: #4f81a8;
      --card-bg: #ffffff;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: var(--bg-light);
      color: var(--text-dark);
    }

    header {
      background-color: var(--bg-light);
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: var(--text-dark);
    }

    nav a {
      color: var(--accent-blue);
      margin: 0 12px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      color: var(--accent-light-blue);
    }

    .banner {
      width: 100%;
      display: block;
      max-height: 280px;
      object-fit: cover;
    }

    .profiles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    @media (min-width: 1200px) {
      .profiles-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--accent-light-blue);
      border-radius: 8px;
      text-align: center;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      cursor: pointer;
    }

    .profile-card img {
      width: 100%;
      border-radius: 6px;
      object-fit: cover;
      transition: transform 0.2s;
    }

    .profile-card img:hover {
      transform: scale(1.05);
    }

    .profile-card h2 {
      color: var(--accent-blue);
      font-size: 1.1rem;
      margin: 10px 0 0;
    }

    .data-message {
      grid-column: 1 / -1;
      text-align: center;
    }

    /* Modal overlay, hidden by default */
    .modal {
      display: none;               /* hidden initially */
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .modal-content {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .close {
      position: absolute;
      top: 15px;
      right: 25px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .close:hover {
      color: #bbb;
    }
  </style>
</head>
<body>
  <header>
    <img class="banner" src="https://github.com/sabaody-showdown/league/blob/main/Graphics/Banner.jpg?raw=true" alt="Sabaody Showdown Banner">
    <h1>Player Profiles</h1>
    <nav>
      <a href="https://sabaody-showdown.github.io/league/">Homepage</a>
      <a href="https://sabaody-showdown.github.io/league/Articles/">Articles</a>
      <a href="https://www.twitch.tv/sabaodyshowdown" target="_blank">Twitch</a>
      <a href="https://www.youtube.com/@sabaodyshowdown?sub_confirmation=1" target="_blank">YouTube</a>
      <a href="https://x.com/sabaodyshowdown" target="_blank">Twitter</a>
    </nav>
  </header>

  <div id="profiles-container" class="profiles-grid"></div>

  <!-- Modal -->
  <div id="imgModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImg" alt="Profile Image">
  </div>

  <script>
    const profilesContainer = document.getElementById("profiles-container");

    const modal = document.getElementById("imgModal");
    const modalImg = document.getElementById("modalImg");
    const closeBtn = document.querySelector(".close");

    async function loadPlayers() {
      try {
        const response = await fetch("./players.json");
        if (!response.ok) {
          throw new Error(`Unable to load player profiles (${response.status}).`);
        }
        const data = await response.json();
        if (!Array.isArray(data.players)) {
          throw new Error("Player profile data must contain a players array.");
        }

        if (!data.players.length) {
          profilesContainer.textContent = "Player profiles will be added soon.";
          return;
        }

        data.players.forEach(player => {
          const card = document.createElement("div");
          card.className = "profile-card";

          const img = document.createElement("img");
          img.src = player.image;
          img.alt = `${player.name} profile`;

          img.onclick = () => openModal(img.src);

          const name = document.createElement("h2");
          name.textContent = player.name;

          card.appendChild(img);
          card.appendChild(name);
          profilesContainer.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        profilesContainer.textContent = "Player profiles could not be loaded. Please try again later.";
      }
    }

    function openModal(src) {
      modal.style.display = "flex";
      modalImg.src = src;
    }

    closeBtn.onclick = () => modal.style.display = "none";
    window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

    loadPlayers();
  </script>
</body>
</html>
